version: '2.1'
services:
   helloservice:
     image: kvalitetsit/medcom-vdx-healthcheck:latest
     environment:
      - usercontext_header_name=X-Test-Auth

      - userattributes_role_key=UserRoles
      - userattributes_org_key=organisation

      - userrole_admin_values=adminrole
      - userrole_user_values=userrole1,userrole2
      - userrole_monitor_values=monitorrole
      - userrole_provisioner_values=provisionerrole

      # Keycloak login tests (client credentials and test user via password grant).
      - KEYCLOAK_TOKEN_URL=https://keycloak.example.com/realms/REALM/protocol/openid-connect/token
      - KEYCLOAK_CLIENT_ID=healthcheck
      - KEYCLOAK_CLIENT_SECRET=secret
      - KEYCLOAK_USERNAME=testuser
      - KEYCLOAK_PASSWORD=password
      # Optional. Defaults to KEYCLOAK_CLIENT_ID / KEYCLOAK_CLIENT_SECRET.
      # - KEYCLOAK_USER_CLIENT_ID=healthcheck-user
      # - KEYCLOAK_USER_CLIENT_SECRET=
     ports:
      - 8080:8080
   documenatation-and-test:
     image: kvalitetsit/medcom-vdx-healthcheck-documentation:latest
     environment:
      - BASE_URL=/test
      - 'SERVER_URLS=[{"url": "http://localhost:8080", "name": "HelloService"}]'
     ports:
      - 80:8080
